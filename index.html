<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mooni widgets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="widgets.css">
<style>
  html, body { height: auto; background: var(--cream); }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-family: var(--serif); color: var(--plum); font-size: 36px; margin: 0 0 20px; }
  .grid { display: grid; gap: 16px; }
  iframe { width: 100%; border: 0; border-radius: 24px; background: transparent; }
  h2 { font-family: var(--serif); font-size: 16px; color: var(--green); margin: 12px 0 6px; }
</style>
</head>
<body>
<main>
  <h1>Mooni widgets</h1>
  <div class="grid">
    <div><h2>countdown.html</h2><iframe src="countdown.html" title="Wedding countdown" height="260"></iframe></div>
    <div><h2>clock.html</h2><iframe src="clock.html" title="Clock" height="130"></iframe></div>
    <div><h2>stars.html</h2><iframe src="stars.html" title="Today's stars" height="330"></iframe></div>
  </div>
</main>
</body>
</html>
