<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="widgets.css">
<style>
  .widget { background: var(--plum); color: #fff; box-shadow: 0 8px 22px rgba(90,37,72,.22); }
  .strip { height: 16px; flex: none; }
  .strip svg { display: block; width: 100%; height: 100%; }
  .body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px 16px 18px; }
  .label { font-size: 13px; letter-spacing: .06em; color: var(--plum-soft); }
  .ring { position: relative; width: 132px; height: 132px; }
  .ring svg { transform: rotate(-90deg); display: block; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .num { font-family: var(--serif); font-size: 36px; font-weight: 600; line-height: 1; }
  .unit { font-size: 12px; color: var(--plum-soft); margin-top: 2px; }
  .date { font-size: 13px; color: var(--plum-soft); }
</style>
</head>
<body>
<div class="widget">
  <div class="strip" aria-hidden="true">
    <svg preserveAspectRatio="none"><defs><pattern id="leo" width="70" height="70" patternUnits="userSpaceOnUse"><rect width="70" height="70" fill="#D6A15E"/><g fill="#B5732F" stroke="#2E1D14" stroke-width="5" stroke-linecap="round"><ellipse cx="18" cy="18" rx="9" ry="7" stroke-dasharray="34 12" transform="rotate(20 18 18)"/><ellipse cx="52" cy="40" rx="10" ry="7" stroke-dasharray="36 12" transform="rotate(-30 52 40)"/><ellipse cx="14" cy="55" rx="7" ry="5" stroke-dasharray="24 10"/></g><g fill="#2E1D14"><circle cx="40" cy="12" r="3"/><circle cx="62" cy="10" r="2.5"/><circle cx="35" cy="58" r="3"/><circle cx="64" cy="64" r="2.5"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#leo)"/></svg>
  </div>
  <div class="body">
    <div class="label">liv &amp; harris wedding</div>
    <div class="ring">
      <svg width="132" height="132" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="8"/>
        <circle id="progress" cx="50" cy="50" r="44" fill="none" stroke="#BFD3A8" stroke-width="8" stroke-linecap="round" stroke-dasharray="0 276.5"/>
      </svg>
      <div class="center">
        <div class="num" id="days" aria-live="polite">--</div>
        <div class="unit" id="unit">days to go</div>
      </div>
    </div>
    <div class="date">April 10, 2027</div>
  </div>
</div>
<script>
  (function () {
    var WEDDING = new Date(2027, 3, 10); // April 10, 2027 (local time)
    var CIRC = 2 * Math.PI * 44;
    var daysEl = document.getElementById('days');
    var unitEl = document.getElementById('unit');
    var ring = document.getElementById('progress');

    function update() {
      var now = new Date();
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var diff = Math.round((WEDDING - today) / 86400000);
      if (diff <= 0) {
        daysEl.textContent = diff === 0 ? 'today!' : 'mr & mrs';
        unitEl.textContent = '';
        ring.setAttribute('stroke-dasharray', CIRC + ' ' + CIRC);
        return;
      }
      daysEl.textContent = String(diff);
      unitEl.textContent = diff === 1 ? 'day to go' : 'days to go';
      var pct = Math.min(1, diff / 365);
      ring.setAttribute('stroke-dasharray', (pct * CIRC).toFixed(1) + ' ' + CIRC.toFixed(1));
    }

    update();
    setInterval(update, 60 * 60 * 1000);
  })();
</script>
</body>
</html>
