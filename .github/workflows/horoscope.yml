name: Daily horoscope

on:
  schedule:
    - cron: "0 13 * * *"   # ~6am Pacific (5am in winter)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch readings
        env:
          HOROSCOPE_API_KEY: ${{ secrets.HOROSCOPE_API_KEY }}
        run: python3 scripts/fetch_horoscope.py
      - name: Commit if changed
        run: |
          git config user.name "mooni-widgets bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/horoscope.json
          git diff --cached --quiet || git commit -m "Update daily horoscope"
          git push
